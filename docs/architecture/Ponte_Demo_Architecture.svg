<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Ponte 醫療 demo 系統架構</title>
<desc id="desc">Browser requests and explicit approvals enter InteractionCore and DemoMedicalWorkflow. The workflow owns approval and receipt verification. ExecutionPipeline dispatches via MCP to the medical mock backend. Tool results return to the workflow. Task and approval state are in memory; synthetic backend records use JSON Lines.</desc>
