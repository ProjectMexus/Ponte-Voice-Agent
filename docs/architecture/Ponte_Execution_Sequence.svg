<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Ponte — Medical Execution Sequence</title><desc id="desc">Final planned cardiology appointment sequence. On 13 October 2026 the requested next Tuesday is 20 October in Asia/Macau. P1 for 14:00 is invalidated on intent change; P2 for 15:30 is approved explicitly. Atomic admission precedes MCP registration and atomic backend booking. Receipt verification precedes confirmed completion.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#3768C2"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#B66B0D"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#0B8071"/></marker></defs><rect width="1920" height="1080" fill="#F6F8FC"/>
